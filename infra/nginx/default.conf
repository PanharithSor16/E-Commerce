# Single public origin: /api/* -> Spring Boot, everything else -> Next.js.
# This file serves plain HTTP for local use; production uses tls.conf (HTTPS + HSTS).

upstream backend  { server backend:8080; keepalive 32; }
upstream frontend { server frontend:3000; keepalive 32; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;   # product images are capped at 5 MB by the API

    include /etc/nginx/conf.d/proxy_common.inc;

    location /api/ {
        proxy_pass http://backend;
    }

    # Actuator lives on the management port and is never routed publicly.
    location /actuator { return 404; }

    location / {
        proxy_pass http://frontend;
    }
}
