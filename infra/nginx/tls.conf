# Production: HTTPS only, HTTP redirects. Mount certificates at /etc/nginx/certs
# (e.g. from certbot / Let's Encrypt) as fullchain.pem and privkey.pem.

upstream backend  { server backend:8080; keepalive 32; }
upstream frontend { server frontend:3000; keepalive 32; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_HOSTNAME};
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 6m;
    include /etc/nginx/conf.d/proxy_common.inc;

    # Edge rate limit for credential endpoints (the API applies its own limits too).
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ { proxy_pass http://backend; }
    location /actuator { return 404; }
    location / { proxy_pass http://frontend; }
}
