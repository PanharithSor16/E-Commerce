spring:
  application:
    name: ecommerce
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ecommerce};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false};sendTimeAsDatetime=false;sendStringParametersAsUnicode=false
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        default_batch_fetch_size: 50
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Regex of reverse-proxy addresses whose X-Forwarded-For is trusted. Empty = trust none.
      internal-proxies: ${APP_TRUSTED_PROXIES_REGEX:}
    max-swallow-size: 6MB
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.org.ecommerce: INFO

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:true}
    session-cookie-name: ${APP_SECURITY_SESSION_COOKIE_NAME:__Host-sid}
    email-hash-key: ${APP_SECURITY_EMAIL_HASH_KEY}
    customer-session:
      idle-timeout: 7d
      absolute-timeout: 30d
    staff-session:
      idle-timeout: 30m
      absolute-timeout: 12h
    lockout:
      max-failures: 5
      window: 15m
      duration: 15m
    auth-rate-limit-per-minute: ${APP_AUTH_RATE_LIMIT:20}
    analytics-rate-limit-per-minute: ${APP_ANALYTICS_RATE_LIMIT:120}
    password-reset-ttl: 30m
    email-verification-ttl: 24h
    require-verified-email-for-checkout: ${APP_REQUIRE_VERIFIED_EMAIL:true}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    currency: USD
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    unpaid-order-timeout: 30m
    payway:
      merchant-id: ${PAYWAY_MERCHANT_ID:}
      api-key: ${PAYWAY_API_KEY:}
      # PayWay's RSA public key (PEM); only needed for refunds
      rsa-public-key: ${PAYWAY_RSA_PUBLIC_KEY:}
      # Sandbox by default; production is https://checkout.payway.com.kh
      base-url: ${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
      callback-url: ${PAYWAY_CALLBACK_URL:}
      # Blank lets the customer choose on PayWay's page; or cards, abapay_khqr, wechat, alipay, ...
      payment-option: ${PAYWAY_PAYMENT_OPTION:}
  pricing:
    tax-rate: ${APP_TAX_RATE:0.00}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    public-path: /api/v1/media
  analytics:
    session-timeout: 30m
    active-visitor-window: 5m
    privacy-policy-version: "1.0"
  retention:
    analytics-events: 395d
    visitor-data: 395d
    login-history: 365d
    auth-sessions: 30d
    user-tokens: 7d
    audit-logs: 730d
    webhook-events: 90d
    anonymous-carts: 30d
