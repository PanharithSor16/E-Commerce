# Full stack: SQL Server + Spring Boot + Next.js behind nginx, with Mailpit for email.
#   cp .env.example .env   # then set real passwords/keys
#   docker compose up -d --build
#   open http://localhost        (Mailpit UI: http://localhost:8025)
# Production adds TLS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: ecommerce

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    networks: [data]
    # Never published publicly. For local tools only, bind to loopback:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates the database and the least-privilege logins (idempotent).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    volumes:
      - ./infra/db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /init.sql
        -v MIGRATOR_PASSWORD="$$DB_MIGRATOR_PASSWORD" APP_PASSWORD="$$DB_APP_PASSWORD"
    networks: [data]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    networks: [app]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ecommerce
      DB_APP_USER: ecommerce_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USER: ecommerce_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_ENCRYPT: "true"
      # The bundled SQL Server uses a self-signed certificate; use a trusted cert for managed databases.
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_BASE_URL:-http://localhost}
      APP_SECURITY_EMAIL_HASH_KEY: ${APP_SECURITY_EMAIL_HASH_KEY:?set APP_SECURITY_EMAIL_HASH_KEY in .env}
      # Only containers on the app network can reach the backend; trust X-Forwarded-For from them.
      APP_TRUSTED_PROXIES_REGEX: ${APP_TRUSTED_PROXIES_REGEX:-172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_REQUIRE_VERIFIED_EMAIL: ${APP_REQUIRE_VERIFIED_EMAIL:-true}
      APP_API_DOCS_ENABLED: ${APP_API_DOCS_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYWAY_MERCHANT_ID: ${PAYWAY_MERCHANT_ID:-}
      PAYWAY_API_KEY: ${PAYWAY_API_KEY:-}
      PAYWAY_RSA_PUBLIC_KEY: ${PAYWAY_RSA_PUBLIC_KEY:-}
      PAYWAY_BASE_URL: ${PAYWAY_BASE_URL:-https://checkout-sandbox.payway.com.kh}
      PAYWAY_CALLBACK_URL: ${PAYWAY_CALLBACK_URL:-}
      PAYWAY_PAYMENT_OPTION: ${PAYWAY_PAYMENT_OPTION:-}
    volumes:
      - uploads:/app/uploads
    networks: [app, data]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Shop}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      backend: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://backend:8080
    networks: [app]
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      frontend: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy_common.inc:/etc/nginx/conf.d/proxy_common.inc:ro
    networks: [app]
    restart: unless-stopped

networks:
  app: {}
  data:
    internal: true   # SQL Server network has no route to the outside world

volumes:
  sqldata: {}
  uploads: {}
